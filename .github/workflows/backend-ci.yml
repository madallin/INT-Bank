name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/kafka-backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server/kafka-backend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: server/kafka-backend

      - name: Run tests
        run: npm run test --if-present
        working-directory: server/kafka-backend

      - name: Build
        run: npm run build
        working-directory: server/kafka-backend
