server:
  port: ${PORT:8443}
  ssl:
    enabled: false

spring:
  application:
    name: intbank-backend

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:intbank}
    username: ${PGUSER:intbank_user}
    password: ${PGPASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      data-source-properties:
        sslmode: ${DB_SSL:require}
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  lifecycle:
    timeout-per-shutdown-phase: 30s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:banking-transfer-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.intbank.core.domain.event"
    listener:
      ack-mode: manual
      auto-startup: ${KAFKA_LISTENER_AUTO_START:false}
    client-id: ${KAFKA_CLIENT_ID:banking-producer}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
      ssl.endpoint.identification.algorithm: ${KAFKA_SSL_ENDPOINT_ID:""}

  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin}

# Feature flags
app:
  kafka:
    enabled: ${KAFKA_ENABLED:true}

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  service-sid: ${TWILIO_SERVICE_SID:}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 300000

# Encryption Keys (AES-256-GCM & HMAC)
encryption:
  aes-key-hex: ${AES_KEY_HEX:}
  hmac-key-hex: ${HMAC_KEY_HEX:}
  card-encryption-key: ${CARD_ENCRYPTION_KEY:}

# HMAC Guard
hmac:
  enabled: ${HMAC_ENABLED:true}

# Geoapify
geoapify:
  key: ${GEOAPIFY_KEY:}

# Cors
cors:
  origins: ${CORS_ORIGIN:*}

# Logging
logging:
  level:
    com.intbank: ${LOG_LEVEL:info}
    org.springframework.kafka: warn
    org.apache.kafka: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator / Observability
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true
    kafka:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true