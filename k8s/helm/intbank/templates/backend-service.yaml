apiVersion: v1
kind: Service
metadata:
  name: {{ include "intbank.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "intbank.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "intbank.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.containerPort }}
      targetPort: http
      protocol: TCP
