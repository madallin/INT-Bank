name: Bank-Grade Tier-1 CI/CD Security & Compliance Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: ISO 27001 Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-quality-security:
    name: Backend Test, ISO 27001 Compliance & Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests & JaCoCo Coverage
        working-directory: server/backend
        run: mvn clean test

      - name: Run OWASP Dependency Check
        working-directory: server/backend
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -Dformat=HTML -DskipTestScope=true || true

      - name: Generate CycloneDX SBOM
        working-directory: server/backend
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:2.8.0:makeAggregateBom

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: server/backend/target/bom.json
          if-no-files-found: warn

  flutter-quality-security:
    name: Flutter Mobile Analyzer, Security Scan & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: internet_banking
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: internet_banking
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests & Generate Coverage
        working-directory: internet_banking
        run: flutter test --coverage

  helm-lint:
    name: Kubernetes Helm Chart & Security Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm Chart
        run: helm lint k8s/helm/intbank

      - name: Helm Template Validation
        run: helm template intbank k8s/helm/intbank > /dev/null

  container-security-scan:
    name: Docker Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend-quality-security, flutter-quality-security]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/backend/Dockerfile
          push: false
          load: true
          tags: intbank-backend:ci-scan

      - name: Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'intbank-backend:ci-scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
