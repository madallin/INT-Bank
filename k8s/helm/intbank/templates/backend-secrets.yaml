{{- if .Values.secrets.external.enabled -}}
# Production: pull secrets from a vault (AWS Secrets Manager / Vault) via the
# External Secrets Operator. The remote secret must contain the keys below.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "intbank.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "intbank.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: {{ .Values.secrets.external.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "intbank.fullname" . }}-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: {{ .Values.secrets.external.remoteKey | quote }}
{{- else -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "intbank.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "intbank.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  AES_KEY_HEX: {{ .Values.secrets.aesKeyHex | quote }}
  HMAC_KEY_HEX: {{ .Values.secrets.hmacKeyHex | quote }}
  CARD_ENCRYPTION_KEY: {{ .Values.secrets.cardEncryptionKey | quote }}
  TWILIO_ACCOUNT_SID: {{ .Values.secrets.twilioAccountSid | quote }}
  TWILIO_AUTH_TOKEN: {{ .Values.secrets.twilioAuthToken | quote }}
  TWILIO_SERVICE_SID: {{ .Values.secrets.twilioServiceSid | quote }}
{{- end -}}
