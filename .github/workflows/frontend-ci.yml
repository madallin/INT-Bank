name: Frontend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env file from secrets
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: |
          echo "SERVER_URL=$SERVER_URL" > .env
          echo "SERVER_PORT=443" >> .env
        working-directory: internet_banking

      - name: Get dependencies
        run: flutter pub get
        working-directory: internet_banking

      - name: Generate code (freezed, json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: internet_banking

      - name: Analyze Dart code
        run: flutter analyze
        working-directory: internet_banking

      - name: Run tests
        run: flutter test --dart-define-from-file=.env
        working-directory: internet_banking
