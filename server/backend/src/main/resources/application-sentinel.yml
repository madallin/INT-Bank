spring:
  data:
    redis:
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      sentinel:
        master: mymaster
        password: ${REDIS_SENTINEL_PASSWORD:}
        nodes:
          - redis-sentinel-1:26379
          - redis-sentinel-2:26380
          - redis-sentinel-3:26381
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
