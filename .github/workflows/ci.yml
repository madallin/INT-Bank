name: CI

# One pipeline for the whole repository. Every step below is a gate: a failing
# test, a coverage drop, an analyzer warning, a leaked secret or a fixable
# HIGH/CRITICAL vulnerability fails the build. Documented exceptions for
# vulnerabilities go in .trivyignore (one CVE per line, with a reason).

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.2'
  # Minimum line coverage of the Flutter app (lcov). The backend floor lives in
  # server/backend/pom.xml (coverage.minimum) and is enforced by `mvn verify`.
  FLUTTER_COVERAGE_MIN: '72'

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@v3.99.0
        with:
          path: ./
          extra_args: --only-verified

  backend:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Unit + integration tests (none excluded), JaCoCo coverage gate, CycloneDX SBOM.
      - name: Build, test and check coverage
        working-directory: server/backend
        run: mvn -B verify

      - name: Upload coverage report and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            server/backend/target/site/jacoco/
            server/backend/target/bom.json
          if-no-files-found: warn

  flutter:
    name: App analysis, tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internet_banking
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Environment config
        run: cp .env.example .env

      - run: flutter pub get

      - name: Generated translations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Analyze (infos are errors)
        run: flutter analyze

      - name: Design and logging rules (counts may only go down)
        run: bash tool/design_rules.sh

      - name: Tests with coverage
        # Golden screenshots differ per OS; they run locally (flutter test --tags golden).
        run: flutter test --coverage --exclude-tags golden

      - name: Coverage gate
        run: |
          # Hand-written code only: generated translations and model code are not counted.
          awk -F: -v min="$FLUTTER_COVERAGE_MIN" '
            /^SF:/ { generated = ($0 ~ /app_localizations|\.g\.dart|\.freezed\.dart/) }
            /^LF:/ { if (!generated) found += $2 }
            /^LH:/ { if (!generated) hit += $2 }
            END {
              pct = 100 * hit / found
              printf "Flutter line coverage (hand-written code): %.2f%% (minimum %s%%)\n", pct, min
              if (pct < min) exit 1
            }' coverage/lcov.info

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: internet_banking/coverage/lcov.info
          if-no-files-found: warn

  dependency-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans pom.xml and pubspec.lock. Fails on HIGH/CRITICAL issues that have a fix.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - run: helm lint k8s/helm/intbank
      - run: helm template intbank k8s/helm/intbank > /dev/null

  container-scan:
    name: Backend image vulnerabilities
    runs-on: ubuntu-latest
    needs: [ backend ]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/backend/Dockerfile
          push: false
          load: true
          tags: intbank-backend:ci

      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: intbank-backend:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '0'

      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.sarif
          if-no-files-found: warn

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: intbank-backend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          exit-code: '1'
