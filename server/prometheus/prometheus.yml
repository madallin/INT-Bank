global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'intbank-backend'
    metrics_path: '/actuator/prometheus'
    scheme: 'https'
    scrape_interval: 10s
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['backend:8443']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
